[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
logfile_maxbytes=10MB
logfile_backups=10
loglevel=error
user=root

#[supervisorctl]
#serverurl=unix:///var/run/supervisor.sock

# One program, not two. Upstream also runs `vosk_server.py` here, which loaded an acoustic model into
# memory and listened on a local websocket. This fork has no model to serve.
[program:app]
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=unexpected
startsecs=10
directory=/ex_app/lib
command=/venv/bin/python3 -u /ex_app/lib/main.py
