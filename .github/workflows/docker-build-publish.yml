#
# Rewritten for this fork. Upstream's version is gated to `nextcloud-releases`, publishes
# under that org, and builds two images with `HAVE_CUDA` / `KALDI_MKL` / `RT_IMAGE` build
# args -- none of which exist in this Dockerfile any more, because there is no Kaldi and no
# Vosk to build. So it would never have run here, and would have failed if it had.
#
# It exists so releasing does not depend on whoever happens to hold a `write:packages` token
# on their laptop: `GITHUB_TOKEN` inside Actions already has it, and an image published from
# a tag is traceable to a commit rather than to somebody's working tree.
name: Docker build and publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      # The image tag comes from appinfo/info.xml rather than from the git tag, because that
      # is the version Nextcloud installs and the two drifting apart is how an admin ends up
      # running an image whose manifest claims a different version.
      - name: Get app version
        id: appinfo
        uses: skjnldsv/xpath-action@f5b036e9d973f42c86324833fd00be90665fbf77 # v1.0.0
        with:
          filename: appinfo/info.xml
          expression: "/info/version/text()"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
        with:
          cache-binary: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get HEAD git commit timestamp
        run: echo "HEAD_TIMESTAMP=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV

      # One image. `linux/amd64` only: this runs on a customer's Nextcloud host, which is a
      # server, and adding arm64 doubles the build for a platform nobody has asked for.
      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        env:
          SOURCE_DATE_EPOCH: ${{ env.HEAD_TIMESTAMP }}
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/korsi-live-bridge:latest
            ghcr.io/${{ github.repository_owner }}/korsi-live-bridge:${{ fromJson(steps.appinfo.outputs.result).version }}
